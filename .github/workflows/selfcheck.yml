name: Selenium Wappalyzer self-diagnosis
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Verify generated fingerprint page']
    types: [completed]

concurrency:
  group: selenium-wappalyzer-selfcheck
  cancel-in-progress: false

jobs:
  selfcheck:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check available Chrome browser
        run: |
          (google-chrome --version || chromium --version || true)
          (chromedriver --version || true)
      - name: Fetch current Chrome Web Store extension and its complete fingerprints
        env:
          CRX_EXTRACT_ZIP_PATH: .selfcheck/wappalyzer.zip
        run: node scripts/selfcheck-prepare.mjs
      - name: Unpack actual Wappalyzer extension for Selenium
        run: python scripts/selfcheck-unpack.py
      - name: Check the actual bundled Wappalyzer matching engine API
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path='.selfcheck/extension/js/wappalyzer.js';
          const source=fs.readFileSync(path,'utf8');
          console.log('BUNDLED_ENGINE',JSON.stringify({bytes:source.length,hasModuleExports:source.includes('module.exports'),hasSetTechnologies:source.includes('setTechnologies'),hasAnalyze:source.includes('analyze('),head:source.slice(0,200)}));
          const core=require('./'+path);
          console.log('CORE_API',JSON.stringify({type:typeof core,keys:Object.keys(core||{}),nullProto:core!==null&&typeof core==='object'&&Object.getPrototypeOf(core)===null,functions:['setTechnologies','setCategories','analyze','resolve','analyzeManyToMany'].map(k=>[k,typeof core?.[k]])}));
          console.log('BUNDLED_TAIL',source.slice(-1700));
          console.log('BUNDLED_EXPORT_CONTEXT',source.slice(Math.max(0,source.indexOf('module.exports')-130),source.indexOf('module.exports')+260));
          NODE
      - name: Install Selenium
        run: python -m pip install 'selenium>=4.35,<5'
      - name: Inspect real extension engine, popup, and local storage in Selenium
        continue-on-error: true
        run: python scripts/probe-extension.py
      - name: Restore prior diagnosis from first-party GitHub Actions cache
        uses: actions/cache/restore@v4
        with:
          path: .selfcheck/cached-report.json
          key: selenium-wappalyzer-${{ github.run_id }}
          restore-keys: |
            selenium-wappalyzer-
      - name: Fetch previous Selenium report for automatic trend comparison
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/selfcheck-previous.py
      - name: Capture actual deployed page with Selenium Chrome
        run: python scripts/selenium-capture.py --url https://wappalyzer-technologies.pages.dev/
      - name: Run original Wappalyzer matching engine and publish report
        run: node scripts/selfcheck-analyze.mjs
      - name: Persist report for the next Selenium run
        if: success()
        run: cp .selfcheck/report.json .selfcheck/cached-report.json
      - name: Save report in GitHub Actions cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .selfcheck/cached-report.json
          key: selenium-wappalyzer-${{ github.run_id }}
      - name: Upload complete self-diagnosis (JSON + Markdown)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-selfcheck
          path: |
            .selfcheck/report.json
            .selfcheck/summary.md
            .selfcheck/capture.json
            .selfcheck/extension-probe.json
          retention-days: 30
          if-no-files-found: warn
